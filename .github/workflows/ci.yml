name: CI

on:
  pull_request:
  push:
    branches: [master, main]

env:
  SKIP_ENV_VALIDATION: "true"

jobs:
  check:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: No DB code in client bundles
        run: |
          if grep -rliE "postgres\.js|pg_advisory|DATABASE_URL" .next/static/chunks; then
            echo "DB code leaked into a client bundle"; exit 1;
          fi

  test-db:
    name: DB tests (real Postgres 17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ggcb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/ggcb_test # secretlint-disable-line
      TEST_DATABASE_URL: postgresql://ggcb_app:ggcb_test_password@localhost:5432/ggcb_test # secretlint-disable-line
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: DB tests
        run: pnpm test:db

      - name: db:verify
        run: pnpm db:verify
        env:
          DIRECT_URL: ${{ env.TEST_DIRECT_URL }}

  e2e:
    name: Playwright (dev + production build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E against dev server
        run: pnpm test:e2e

      - name: E2E against production build
        run: pnpm test:e2e:prod

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan for secrets
        run: pnpm exec secretlint --secretlintignore .gitignore "**/*"
