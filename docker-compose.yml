# Local Postgres for development + test:db (matches the GitHub Actions
# service container). Postgres 17 — the assumed Supabase major version
# (see docs/reports/phase-02.md). Not a runtime dependency of the app.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ggcb_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local SMTP sink for the email worker (Prompt 4). Point
  # EMAIL_MODE=smtp, SMTP_HOST=localhost, SMTP_PORT=1025, SMTP_SECURE=false
  # (STARTTLS: Mailpit accepts plain for dev), any SMTP_USER/PASSWORD, and
  # browse http://localhost:8025 to inspect captured mail. Infrastructure,
  # not an application dependency.
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI + API

volumes:
  pgdata:
